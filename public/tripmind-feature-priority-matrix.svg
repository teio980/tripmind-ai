<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">TripMind feature prioritization matrix</title>
  <desc id="desc">A user-value versus implementation-effort matrix showing which TripMind features are in the prototype, planned for the build phase, deferred, or outside scope.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#17332f" flood-opacity="0.12"/>
    </filter>
    <style>
      .title { font: 800 42px 'Segoe UI', Arial, sans-serif; fill: #17332f; letter-spacing: -1px; }
      .subtitle { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #6c7d78; }
      .axis { font: 800 17px 'Segoe UI', Arial, sans-serif; fill: #2b4a44; letter-spacing: 0.8px; }
      .axisEnd { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #6c7d78; }
      .quad { font: 800 20px 'Segoe UI', Arial, sans-serif; letter-spacing: 0.4px; }
      .quadSub { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #6c7d78; }
      .chip { font: 750 16px 'Segoe UI', Arial, sans-serif; fill: #17332f; }
      .chipSmall { font: 700 14px 'Segoe UI', Arial, sans-serif; fill: #17332f; }
      .legend { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #2b4a44; }
      .footer { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #6c7d78; letter-spacing: 0.3px; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f7f8f5"/>
  <circle cx="1490" cy="40" r="210" fill="#ddf2ed" opacity="0.75"/>
  <circle cx="-20" cy="1010" r="210" fill="#e8f2fb" opacity="0.72"/>

  <g transform="translate(72 58)">
    <rect width="56" height="56" rx="16" fill="#0e7168"/>
    <path d="M13 38c8 5 23 2 27-8 3-7-2-11-9-9-6 2-7 8-2 10 6 3 13-3 17-14" fill="none" stroke="#d9f1e8" stroke-width="4" stroke-linecap="round"/>
    <path d="m43 7 2.2 5.2 5.2 2.2-5.2 2.2-2.2 5.2-2.2-5.2-5.2-2.2 5.2-2.2Z" fill="#f4b95f"/>
  </g>
  <text x="148" y="86" class="title">Feature Prioritization Matrix</text>
  <text x="148" y="117" class="subtitle">Balancing traveler value with prototype feasibility</text>

  <g transform="translate(1115 73)">
    <rect width="118" height="34" rx="17" fill="#ddf2ed"/>
    <circle cx="20" cy="17" r="6" fill="#0e7168"/><text x="34" y="22" class="legend">Prototype</text>
    <rect x="132" width="126" height="34" rx="17" fill="#e8f2fb"/>
    <circle cx="152" cy="17" r="6" fill="#3678b8"/><text x="166" y="22" class="legend">Build next</text>
    <rect x="272" width="120" height="34" rx="17" fill="#fff4df"/>
    <circle cx="292" cy="17" r="6" fill="#c78324"/><text x="306" y="22" class="legend">Deferred</text>
  </g>

  <!-- matrix canvas -->
  <g transform="translate(185 176)">
    <rect width="1260" height="650" rx="28" fill="#ffffff" stroke="#d7e3de" stroke-width="2" filter="url(#shadow)"/>
    <path d="M630 0v650M0 325h1260" stroke="#cfdcd6" stroke-width="2" stroke-dasharray="9 10"/>

    <rect x="18" y="18" width="594" height="289" rx="20" fill="#f0faf7"/>
    <rect x="648" y="18" width="594" height="289" rx="20" fill="#f1f7fc"/>
    <rect x="18" y="343" width="594" height="289" rx="20" fill="#fffaf0"/>
    <rect x="648" y="343" width="594" height="289" rx="20" fill="#fff5f2"/>

    <g transform="translate(42 42)">
      <rect width="124" height="32" rx="16" fill="#ddf2ed"/>
      <text x="62" y="22" text-anchor="middle" class="quad" fill="#0e7168">BUILD NOW</text>
      <text x="0" y="54" class="quadSub">High value · Lower effort · Core prototype proof</text>
    </g>
    <g transform="translate(672 42)">
      <rect width="164" height="32" rx="16" fill="#e8f2fb"/>
      <text x="82" y="22" text-anchor="middle" class="quad" fill="#3678b8">STRATEGIC NEXT</text>
      <text x="0" y="54" class="quadSub">High value · Higher effort · Build phase</text>
    </g>
    <g transform="translate(42 367)">
      <rect width="148" height="32" rx="16" fill="#fff4df"/>
      <text x="74" y="22" text-anchor="middle" class="quad" fill="#9b671e">QUICK EXTRAS</text>
      <text x="0" y="54" class="quadSub">Lower core value · Lower effort</text>
    </g>
    <g transform="translate(672 367)">
      <rect width="170" height="32" rx="16" fill="#fff0ec"/>
      <text x="85" y="22" text-anchor="middle" class="quad" fill="#b34f3e">DEFER / EXCLUDE</text>
      <text x="0" y="54" class="quadSub">Higher effort · Outside the shortest trusted loop</text>
    </g>

    <!-- Build now chips -->
    <g filter="url(#shadow)">
      <g transform="translate(52 126)"><rect width="204" height="52" rx="14" fill="#ffffff" stroke="#9fd4c7" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#0e7168"/><text x="43" y="32" class="chip">AI Chatbox</text></g>
      <g transform="translate(276 126)"><rect width="274" height="52" rx="14" fill="#ffffff" stroke="#9fd4c7" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#0e7168"/><text x="43" y="32" class="chip">Requirement Clarifier</text></g>
      <g transform="translate(52 196)"><rect width="248" height="52" rx="14" fill="#ffffff" stroke="#9fd4c7" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#0e7168"/><text x="43" y="32" class="chip">Experience Diff</text></g>
      <g transform="translate(320 196)"><rect width="230" height="52" rx="14" fill="#ffffff" stroke="#9fd4c7" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#0e7168"/><text x="43" y="32" class="chip">Locked plans</text></g>
      <g transform="translate(52 266)"><rect width="224" height="52" rx="14" fill="#ffffff" stroke="#9fd4c7" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#0e7168"/><text x="43" y="32" class="chip">Local replan</text></g>
      <g transform="translate(296 266)"><rect width="254" height="52" rx="14" fill="#ffffff" stroke="#9fd4c7" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#0e7168"/><text x="43" y="32" class="chip">Harmony + Energy</text></g>
    </g>

    <!-- Strategic next chips -->
    <g filter="url(#shadow)">
      <g transform="translate(682 126)"><rect width="264" height="52" rx="14" fill="#ffffff" stroke="#acd0ec" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#3678b8"/><text x="43" y="32" class="chip">Authenticated trips</text></g>
      <g transform="translate(966 126)"><rect width="244" height="52" rx="14" fill="#ffffff" stroke="#acd0ec" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#3678b8"/><text x="43" y="32" class="chip">Live AI provider</text></g>
      <g transform="translate(682 196)"><rect width="268" height="52" rx="14" fill="#ffffff" stroke="#acd0ec" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#3678b8"/><text x="43" y="32" class="chip">Multi-user persistence</text></g>
      <g transform="translate(970 196)"><rect width="240" height="52" rx="14" fill="#ffffff" stroke="#acd0ec" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#3678b8"/><text x="43" y="32" class="chipSmall">Private aggregation</text></g>
      <g transform="translate(764 266)"><rect width="364" height="52" rx="14" fill="#ffffff" stroke="#acd0ec" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#3678b8"/><text x="43" y="32" class="chip">Maps + weather adapters</text></g>
    </g>

    <!-- Quick extras chips -->
    <g filter="url(#shadow)">
      <g transform="translate(52 451)"><rect width="222" height="52" rx="14" fill="#ffffff" stroke="#e6ca91" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#c78324"/><text x="43" y="32" class="chip">PWA install</text></g>
      <g transform="translate(294 451)"><rect width="256" height="52" rx="14" fill="#ffffff" stroke="#e6ca91" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#c78324"/><text x="43" y="32" class="chip">Discover suggestions</text></g>
      <g transform="translate(118 526)"><rect width="366" height="52" rx="14" fill="#ffffff" stroke="#e6ca91" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#c78324"/><text x="43" y="32" class="chip">More disruption scenarios</text></g>
    </g>

    <!-- Defer chips -->
    <g filter="url(#shadow)">
      <g transform="translate(682 451)"><rect width="246" height="52" rx="14" fill="#ffffff" stroke="#e8b8af" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#c95e4b"/><text x="43" y="32" class="chip">Booking + payments</text></g>
      <g transform="translate(948 451)"><rect width="262" height="52" rx="14" fill="#ffffff" stroke="#e8b8af" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#c78324"/><text x="43" y="32" class="chipSmall">Offline editing + sync</text></g>
      <g transform="translate(682 526)"><rect width="226" height="52" rx="14" fill="#ffffff" stroke="#e8b8af" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#c78324"/><text x="43" y="32" class="chip">Full admin suite</text></g>
      <g transform="translate(928 526)"><rect width="282" height="52" rx="14" fill="#ffffff" stroke="#e8b8af" stroke-width="2"/><circle cx="25" cy="26" r="7" fill="#c78324"/><text x="43" y="32" class="chipSmall">Global optimization solver</text></g>
      <g transform="translate(782 591)"><rect width="328" height="42" rx="14" fill="#ffffff" stroke="#e8b8af" stroke-width="2"/><circle cx="23" cy="21" r="7" fill="#c78324"/><text x="41" y="27" class="chipSmall">Every provider at once</text></g>
    </g>
  </g>

  <!-- axes -->
  <path d="M185 852h1260" stroke="#2b4a44" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M158 826V176" stroke="#2b4a44" stroke-width="3"/>
  <path d="m145 198 13-22 13 22" fill="none" stroke="#2b4a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="m1423 839 22 13-22 13" fill="none" stroke="#2b4a44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="815" y="900" text-anchor="middle" class="axis">IMPLEMENTATION EFFORT</text>
  <text x="185" y="878" class="axisEnd">LOW</text>
  <text x="1405" y="878" text-anchor="end" class="axisEnd">HIGH</text>
  <text x="91" y="506" text-anchor="middle" class="axis" transform="rotate(-90 91 506)">TRAVELER VALUE</text>
  <text x="130" y="816" text-anchor="end" class="axisEnd">LOW</text>
  <text x="130" y="195" text-anchor="end" class="axisEnd">HIGH</text>

  <g transform="translate(430 934)">
    <rect width="740" height="42" rx="21" fill="#ffffff" stroke="#d7e3de"/>
    <text x="370" y="27" text-anchor="middle" class="footer">Decision rule: prove one trustworthy end-to-end loop before expanding breadth</text>
  </g>
</svg>
