<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc">
  <title id="title">TripMind affinity diagram</title>
  <desc id="desc">An ideation board grouping TripMind ideas into planning friction, group coordination, trust and feasibility, trip reality, and later opportunities. Notes are marked chosen, deferred, or dropped.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#17332f" flood-opacity="0.11"/>
    </filter>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#17332f" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 800 42px 'Segoe UI', Arial, sans-serif; fill: #17332f; letter-spacing: -1px; }
      .subtitle { font: 500 20px 'Segoe UI', Arial, sans-serif; fill: #6c7d78; }
      .cluster { font: 800 22px 'Segoe UI', Arial, sans-serif; fill: #17332f; }
      .clusterSub { font: 600 14px 'Segoe UI', Arial, sans-serif; fill: #6c7d78; letter-spacing: 0.7px; }
      .note { font: 700 18px 'Segoe UI', Arial, sans-serif; fill: #17332f; }
      .noteSmall { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #2b4a44; }
      .tag { font: 800 13px 'Segoe UI', Arial, sans-serif; letter-spacing: 0.6px; }
      .centerTitle { font: 800 23px 'Segoe UI', Arial, sans-serif; fill: white; }
      .centerSub { font: 600 15px 'Segoe UI', Arial, sans-serif; fill: #d9f1e8; }
      .legend { font: 700 15px 'Segoe UI', Arial, sans-serif; fill: #2b4a44; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#f7f8f5"/>
  <circle cx="1420" cy="-20" r="230" fill="#ddf2ed" opacity="0.75"/>
  <circle cx="90" cy="970" r="180" fill="#e8f2fb" opacity="0.7"/>

  <g transform="translate(72 58)">
    <rect width="56" height="56" rx="16" fill="#0e7168"/>
    <path d="M13 38c8 5 23 2 27-8 3-7-2-11-9-9-6 2-7 8-2 10 6 3 13-3 17-14" fill="none" stroke="#d9f1e8" stroke-width="4" stroke-linecap="round"/>
    <path d="m43 7 2.2 5.2 5.2 2.2-5.2 2.2-2.2 5.2-2.2-5.2-5.2-2.2 5.2-2.2Z" fill="#f4b95f"/>
  </g>
  <text x="148" y="86" class="title">TripMind Ideation Board</text>
  <text x="148" y="117" class="subtitle">How scattered travel problems became one explainable planning workflow</text>

  <g transform="translate(1110 73)">
    <rect x="0" y="0" width="112" height="34" rx="17" fill="#ddf2ed"/>
    <circle cx="20" cy="17" r="6" fill="#0e7168"/>
    <text x="34" y="22" class="legend">Chosen</text>
    <rect x="126" y="0" width="122" height="34" rx="17" fill="#fff4df"/>
    <circle cx="146" cy="17" r="6" fill="#c78324"/>
    <text x="160" y="22" class="legend">Deferred</text>
    <rect x="262" y="0" width="118" height="34" rx="17" fill="#fff0ec"/>
    <circle cx="282" cy="17" r="6" fill="#c95e4b"/>
    <text x="296" y="22" class="legend">Dropped</text>
  </g>

  <!-- connecting idea trails -->
  <g fill="none" stroke="#a9c7bf" stroke-width="3" stroke-dasharray="6 10" opacity="0.8">
    <path d="M482 365 C600 365 610 440 692 466"/>
    <path d="M1118 365 C1005 365 990 438 908 466"/>
    <path d="M484 728 C600 715 630 590 700 554"/>
    <path d="M1116 728 C1000 715 970 590 900 554"/>
  </g>

  <!-- planning friction cluster -->
  <g transform="translate(70 168)">
    <rect width="470" height="310" rx="26" fill="#ffffff" stroke="#d9e7e1" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="38" cy="40" r="17" fill="#e8f2fb"/>
    <path d="M30 40h16M38 32v16" stroke="#3678b8" stroke-width="3" stroke-linecap="round"/>
    <text x="68" y="40" class="cluster">Planning friction</text>
    <text x="68" y="63" class="clusterSub">STARTING WITHOUT A COMPLETE PLAN</text>

    <g transform="translate(28 91) rotate(-1)">
      <rect width="194" height="82" rx="11" fill="#e8f2fb" filter="url(#softShadow)"/>
      <text x="18" y="31" class="note">Start with one</text><text x="18" y="56" class="note">sentence</text>
      <circle cx="172" cy="20" r="7" fill="#0e7168"/>
    </g>
    <g transform="translate(242 88) rotate(1)">
      <rect width="198" height="88" rx="11" fill="#ddf2ed" filter="url(#softShadow)"/>
      <text x="18" y="34" class="note">Ask only what</text><text x="18" y="60" class="note">blocks progress</text>
      <circle cx="176" cy="20" r="7" fill="#0e7168"/>
    </g>
    <g transform="translate(43 202) rotate(1)">
      <rect width="182" height="76" rx="11" fill="#fff0ec" filter="url(#softShadow)"/>
      <text x="16" y="31" class="noteSmall">Long form before</text><text x="16" y="54" class="noteSmall">planning</text>
      <circle cx="160" cy="19" r="7" fill="#c95e4b"/>
    </g>
    <g transform="translate(246 198) rotate(-1)">
      <rect width="184" height="80" rx="11" fill="#ddf2ed" filter="url(#softShadow)"/>
      <text x="16" y="32" class="noteSmall">Editable requirement</text><text x="16" y="56" class="noteSmall">summary</text>
      <circle cx="162" cy="19" r="7" fill="#0e7168"/>
    </g>
  </g>

  <!-- group coordination cluster -->
  <g transform="translate(565 168)">
    <rect width="470" height="238" rx="26" fill="#ffffff" stroke="#d9e7e1" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="38" cy="40" r="17" fill="#ddf2ed"/>
    <circle cx="34" cy="37" r="5" fill="#0e7168"/><circle cx="43" cy="37" r="5" fill="#0e7168"/><path d="M27 51c2-7 12-8 15-2M38 49c3-5 10-4 12 2" fill="none" stroke="#0e7168" stroke-width="2.4" stroke-linecap="round"/>
    <text x="68" y="40" class="cluster">Group coordination</text>
    <text x="68" y="63" class="clusterSub">FAIRNESS WITHOUT EXPOSING PRIVATE INPUT</text>

    <g transform="translate(28 92) rotate(-1)">
      <rect width="188" height="70" rx="11" fill="#ddf2ed" filter="url(#softShadow)"/>
      <text x="18" y="29" class="noteSmall">Protect the lowest</text><text x="18" y="52" class="noteSmall">satisfaction</text>
      <circle cx="166" cy="18" r="7" fill="#0e7168"/>
    </g>
    <g transform="translate(237 90) rotate(1)">
      <rect width="205" height="72" rx="11" fill="#e8f2fb" filter="url(#softShadow)"/>
      <text x="17" y="30" class="noteSmall">Aggregate needs, keep</text><text x="17" y="53" class="noteSmall">raw inputs private</text>
      <circle cx="183" cy="18" r="7" fill="#0e7168"/>
    </g>
    <g transform="translate(124 176) rotate(-0.5)">
      <rect width="226" height="44" rx="11" fill="#fff0ec" filter="url(#softShadow)"/>
      <text x="18" y="28" class="noteSmall">Mandatory invite first</text>
      <circle cx="204" cy="16" r="7" fill="#c95e4b"/>
    </g>
  </g>

  <!-- trust cluster -->
  <g transform="translate(1060 168)">
    <rect width="470" height="310" rx="26" fill="#ffffff" stroke="#d9e7e1" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="38" cy="40" r="17" fill="#fff4df"/>
    <path d="M38 27l10 4v8c0 8-4 13-10 17-6-4-10-9-10-17v-8Z" fill="none" stroke="#c78324" stroke-width="2.5"/><path d="m33 40 4 4 7-9" fill="none" stroke="#c78324" stroke-width="2.5" stroke-linecap="round"/>
    <text x="68" y="40" class="cluster">Trust &amp; feasibility</text>
    <text x="68" y="63" class="clusterSub">EXPLAIN, VALIDATE, THEN APPLY</text>

    <g transform="translate(28 90) rotate(1)">
      <rect width="194" height="84" rx="11" fill="#fff4df" filter="url(#softShadow)"/>
      <text x="17" y="33" class="note">Experience Diff</text><text x="17" y="59" class="noteSmall">before approval</text>
      <circle cx="172" cy="19" r="7" fill="#0e7168"/>
    </g>
    <g transform="translate(242 91) rotate(-1)">
      <rect width="198" height="84" rx="11" fill="#ddf2ed" filter="url(#softShadow)"/>
      <text x="17" y="32" class="noteSmall">Deterministic rules</text><text x="17" y="57" class="noteSmall">validate AI ideas</text>
      <circle cx="176" cy="19" r="7" fill="#0e7168"/>
    </g>
    <g transform="translate(42 205) rotate(-1)">
      <rect width="185" height="73" rx="11" fill="#fff0ec" filter="url(#softShadow)"/>
      <text x="16" y="29" class="noteSmall">Direct AI</text><text x="16" y="52" class="noteSmall">overwrite</text>
      <circle cx="163" cy="18" r="7" fill="#c95e4b"/>
    </g>
    <g transform="translate(248 201) rotate(1)">
      <rect width="181" height="77" rx="11" fill="#e8f2fb" filter="url(#softShadow)"/>
      <text x="16" y="30" class="noteSmall">Versions and</text><text x="16" y="54" class="noteSmall">recoverable history</text>
      <circle cx="159" cy="18" r="7" fill="#0e7168"/>
    </g>
  </g>

  <!-- center selected concept -->
  <g transform="translate(655 436)" filter="url(#shadow)">
    <rect width="290" height="140" rx="34" fill="#0e7168"/>
    <text x="145" y="48" text-anchor="middle" class="centerSub">SELECTED CONCEPT</text>
    <text x="145" y="82" text-anchor="middle" class="centerTitle">Explainable travel</text>
    <text x="145" y="111" text-anchor="middle" class="centerTitle">decision layer</text>
  </g>

  <!-- trip reality cluster -->
  <g transform="translate(70 520)">
    <rect width="500" height="370" rx="26" fill="#ffffff" stroke="#d9e7e1" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="38" cy="40" r="17" fill="#fff4df"/>
    <path d="M38 28v12l8 5M28 53h20" fill="none" stroke="#c78324" stroke-width="2.8" stroke-linecap="round"/>
    <text x="68" y="40" class="cluster">Trip reality</text>
    <text x="68" y="63" class="clusterSub">ENERGY, COMMITMENTS, AND DISRUPTIONS</text>

    <g transform="translate(28 91) rotate(-1)">
      <rect width="204" height="84" rx="11" fill="#fff4df" filter="url(#softShadow)"/>
      <text x="17" y="33" class="note">Travel Energy</text><text x="17" y="59" class="noteSmall">walking + rest</text>
      <circle cx="182" cy="19" r="7" fill="#0e7168"/>
    </g>
    <g transform="translate(253 90) rotate(1)">
      <rect width="218" height="86" rx="11" fill="#ddf2ed" filter="url(#softShadow)"/>
      <text x="17" y="34" class="note">Locked plans</text><text x="17" y="60" class="noteSmall">must be preserved</text>
      <circle cx="196" cy="19" r="7" fill="#0e7168"/>
    </g>
    <g transform="translate(36 204) rotate(1)">
      <rect width="222" height="87" rx="11" fill="#e8f2fb" filter="url(#softShadow)"/>
      <text x="17" y="34" class="note">Local repair</text><text x="17" y="60" class="noteSmall">change one window</text>
      <circle cx="200" cy="19" r="7" fill="#0e7168"/>
    </g>
    <g transform="translate(276 206) rotate(-1)">
      <rect width="190" height="84" rx="11" fill="#fff0ec" filter="url(#softShadow)"/>
      <text x="16" y="32" class="noteSmall">Regenerate the</text><text x="16" y="56" class="noteSmall">whole day</text>
      <circle cx="168" cy="19" r="7" fill="#c95e4b"/>
    </g>
    <g transform="translate(122 311)">
      <rect width="260" height="40" rx="20" fill="#f0faf7" stroke="#b8ddd4"/>
      <text x="130" y="26" text-anchor="middle" class="tag" fill="#0e7168">PROTECT THE EXPERIENCE</text>
    </g>
  </g>

  <!-- later opportunities cluster -->
  <g transform="translate(1030 520)">
    <rect width="500" height="370" rx="26" fill="#ffffff" stroke="#d9e7e1" stroke-width="2" filter="url(#shadow)"/>
    <circle cx="38" cy="40" r="17" fill="#eeedf5"/>
    <path d="m38 27 3.5 8.5 8.5 3.5-8.5 3.5L38 51l-3.5-8.5L26 39l8.5-3.5Z" fill="#5b5b72"/>
    <text x="68" y="40" class="cluster">Later opportunities</text>
    <text x="68" y="63" class="clusterSub">VALUABLE, BUT NOT NEEDED FOR THE PROTOTYPE</text>

    <g transform="translate(28 91) rotate(1)">
      <rect width="205" height="84" rx="11" fill="#fff4df" filter="url(#softShadow)"/>
      <text x="17" y="33" class="note">Discover</text><text x="17" y="59" class="noteSmall">safe spontaneity</text>
      <circle cx="183" cy="19" r="7" fill="#c78324"/>
    </g>
    <g transform="translate(254 90) rotate(-1)">
      <rect width="218" height="86" rx="11" fill="#fff4df" filter="url(#softShadow)"/>
      <text x="17" y="33" class="noteSmall">Offline editing +</text><text x="17" y="58" class="noteSmall">background sync</text>
      <circle cx="196" cy="19" r="7" fill="#c78324"/>
    </g>
    <g transform="translate(39 205) rotate(-1)">
      <rect width="205" height="84" rx="11" fill="#fff0ec" filter="url(#softShadow)"/>
      <text x="17" y="32" class="noteSmall">Booking and</text><text x="17" y="56" class="noteSmall">payments</text>
      <circle cx="183" cy="19" r="7" fill="#c95e4b"/>
    </g>
    <g transform="translate(266 204) rotate(1)">
      <rect width="200" height="86" rx="11" fill="#fff4df" filter="url(#softShadow)"/>
      <text x="16" y="32" class="noteSmall">Every provider</text><text x="16" y="56" class="noteSmall">at once</text>
      <circle cx="178" cy="19" r="7" fill="#c78324"/>
    </g>
    <g transform="translate(121 311)">
      <rect width="258" height="40" rx="20" fill="#fffaf0" stroke="#ead3a7"/>
      <text x="129" y="26" text-anchor="middle" class="tag" fill="#9b671e">KEEP THE CORE LOOP SMALL</text>
    </g>
  </g>

  <text x="800" y="952" text-anchor="middle" class="clusterSub">ROUGH IDEAS → CLUSTERS → TRADE-OFFS → SELECTED PRODUCT THESIS</text>
</svg>
